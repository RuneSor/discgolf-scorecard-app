<style>
  :root{
    --bg: #eef2e9;
    --surface: #ffffff;
    --ink: #1d3327;
    --ink-soft: #4a5c50;
    --pine: #2f5744;
    --pine-dark: #1d3327;
    --sky: #4e88a8;
    --gold: #d9a441;
    --rust: #b24a34;
    --rust-soft: #c97a5d;
    --muted: #8c9a8e;
    --line: #d8e0d2;
    --gps: #2b7bd6;
    --radius: 16px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  #root{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    padding: max(18px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }
  h1,h2,h3{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    letter-spacing: 0.01em;
    margin:0;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 18px;
  }
  .topbar h1{
    font-size: 28px;
    color: var(--pine-dark);
    text-transform: uppercase;
  }
  .chainmark{ flex-shrink:0; }
  .card{
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 1px 2px rgba(29,51,39,0.06), 0 8px 24px rgba(29,51,39,0.05);
  }
  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size: 13px;
    font-weight:600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom:6px;
  }
  input[type=number], input[type=text]{
    width:100%;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 17px;
    font-family:'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  input:focus{ outline: 2px solid var(--pine); outline-offset:1px; }
  .player-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .player-row:last-child{ border-bottom:none; }
  .player-row .name{
    flex:1;
    font-weight:600;
    font-size:16px;
  }
  .icon-btn{
    background: none;
    border:none;
    color: var(--rust);
    font-size: 20px;
    line-height:1;
    padding: 4px 8px;
    cursor:pointer;
  }
  .add-row{ display:flex; gap:8px; margin-top:4px; }
  .add-row input{ flex:1; }
  .btn{
    border:none;
    border-radius: 12px;
    padding: 14px 18px;
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size: 18px;
    letter-spacing:0.02em;
    text-transform: uppercase;
    cursor:pointer;
    text-align:center;
  }
  .btn-primary{ background: var(--pine); color:#fff; width:100%; }
  .btn-primary:disabled{ background: var(--muted); cursor:not-allowed; }
  .btn-secondary{ background: var(--bg); color: var(--pine-dark); border:1.5px solid var(--line); width:100%; }
  .btn-add{ background: var(--sky); color:#fff; padding: 12px 16px; flex-shrink:0; }
  .btn-ghost{ background:none; color: var(--pine); font-weight:600; font-size:14px; text-transform:none; font-family:'Inter',sans-serif; padding:8px; }

  /* Play screen */
  .hole-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 14px;
  }
  .hole-title{ text-align:center; }
  .hole-title .hole-num{ font-size: 44px; color: var(--pine-dark); line-height:1; }
  .hole-title .hole-sub{ font-size: 13px; color: var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em; }
  .nav-arrow{
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 50%;
    width: 44px; height:44px;
    font-size: 20px;
    color: var(--pine-dark);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .nav-arrow:disabled{ opacity:0.3; cursor:default; }

  .chain-dots{
    display:flex;
    gap:5px;
    overflow-x:auto;
    padding: 4px 2px 14px;
  }
  .chain-dots::-webkit-scrollbar{ display:none; }
  .dot{
    flex-shrink:0;
    width:9px; height:9px;
    border-radius:50%;
    background: var(--line);
  }
  /* Center the dots; auto margins keep them scrollable when they overflow */
  .dot:first-child{ margin-left:auto; }
  .dot:last-child{ margin-right:auto; }
  .dot.done{ background: var(--pine); }
  .dot.current{ background: var(--gold); width:12px; height:12px; }

  .par-control{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin: 4px 0 18px;
    padding: 10px;
    background: var(--bg);
    border-radius: 12px;
  }
  .par-control .label{
    font-size:13px;
    font-weight:700;
    color: var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stepper button{
    width:34px; height:34px;
    border-radius:50%;
    border: none;
    background: var(--surface);
    box-shadow: 0 1px 3px rgba(29,51,39,0.15);
    font-size:18px;
    font-weight:700;
    color: var(--pine-dark);
    cursor:pointer;
  }
  .stepper .val{
    min-width: 26px;
    text-align:center;
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    font-size:22px;
  }

  .score-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .score-row:last-child{ border-bottom:none; }
  .score-row .pname{
    flex:1;
    font-weight:600;
    font-size:16px;
  }
  .badge{
    min-width: 44px;
    text-align:center;
    padding: 4px 8px;
    border-radius: 20px;
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    font-size:15px;
    color:#fff;
  }
  .bottom-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top: 18px;
  }
  .bottom-row{ display:flex; gap:10px; }
  .bottom-row .btn{ flex:1; }

  /* Summary */
  .table-wrap{ overflow-x:auto; margin: -4px -4px 16px; padding: 4px; }
  table{ border-collapse: collapse; width:100%; min-width: 100%; }
  th,td{
    text-align:center;
    padding: 8px 10px;
    font-size: 14px;
    border-bottom: 1px solid var(--line);
    white-space:nowrap;
  }
  th{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size:14px;
    color: var(--ink-soft);
    text-transform:uppercase;
  }
  td.pname-cell, th.pname-cell{
    text-align:left;
    position: sticky;
    left:0;
    background: var(--surface);
    font-weight:600;
  }
  tr.par-row td{ color: var(--muted); font-weight:600; }
  tr.total-row td{ font-weight:800; border-top: 2px solid var(--ink); border-bottom:none; }
  tr.winner td.pname-cell{ color: var(--pine); }
  .winner-tag{
    display:inline-block;
    margin-left:6px;
    font-size:12px;
    background: var(--gold);
    color:#fff;
    padding: 1px 7px;
    border-radius: 10px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    vertical-align: middle;
  }

  /* Modal */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(29,51,39,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    z-index: 100;
  }
  .modal-box{
    background: var(--surface);
    border-radius: var(--radius);
    padding: 22px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 12px 40px rgba(29,51,39,0.25);
  }
  .modal-msg{
    margin: 0 0 14px;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    line-height:1.4;
  }
  .modal-box input[type=text]{ margin-bottom: 14px; }
  .modal-actions{
    display:flex;
    gap:10px;
  }
  .modal-actions .btn{ flex:1; }

  /* Small rounded button, e.g. "Bruk" and "Kart" */
  .btn-pill{
    background: var(--surface);
    color: var(--pine-dark);
    border:1.5px solid var(--line);
    border-radius: 8px;
    padding: 7px 14px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    flex-shrink:0;
  }
  .btn-pill:active{ background: var(--bg); }

  /* Map */
  .btn-map{ margin-left:auto; }
  .btn-map .has-tee{
    width:8px; height:8px; border-radius:50%;
    background: var(--gold);
  }
  /* The map reuses .modal-overlay/.modal-box; these only change size and stacking */
  .map-overlay{
    padding: max(16px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
    z-index: 200;
  }
  .map-overlay[hidden]{ display:none; }
  .map-box{
    padding: 0;
    border: 3px solid var(--pine);
    max-width: 480px;
    height: 100%;
    max-height: 640px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .map-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 10px 10px 10px 14px;
    border-bottom: 1.5px solid var(--line);
  }
  .map-head h2{ font-size:22px; color: var(--pine-dark); text-transform:uppercase; margin-right:auto; }
  .map-head h2 span{ color: var(--ink-soft); font-size:16px; font-weight:700; }
  .map-layer-btn{
    background: var(--bg);
    border:1.5px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    color: var(--pine-dark);
    cursor:pointer;
  }
  #map{ flex:1; min-height:0; background: var(--bg); }
  .map-foot{
    padding: 10px 12px 12px;
    border-top: 1.5px solid var(--line);
  }
  .map-status{
    font-size:14px;
    color: var(--ink-soft);
    margin-bottom: 10px;
    min-height: 1.4em;
    text-align:center;
  }
  .map-status b{ color: var(--ink); }
  .map-actions{ display:flex; gap:10px; }
  .map-actions .btn{ flex:1; }
  .tee-icon{
    width:30px; height:30px;
    border-radius:50% 50% 50% 0;
    transform: rotate(-45deg);
    background: var(--gold);
    border: 2.5px solid var(--surface);
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center;
  }
  .tee-icon span{
    transform: rotate(45deg);
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    font-size:15px;
    color: var(--pine-dark);
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="mapOverlay" class="modal-overlay map-overlay" hidden onclick="if(event.target===this) closeMap()">
  <div class="modal-box map-box" role="dialog" aria-label="Kart">
    <div class="map-head">
      <h2 id="mapTitle"></h2>
      <button class="map-layer-btn" id="mapLayerBtn" onclick="toggleMapLayer()"></button>
      <button class="icon-btn" onclick="closeMap()" aria-label="Lukk kart">✕</button>
    </div>
    <div id="map"></div>
    <div class="map-foot">
      <div class="map-status" id="mapStatus"></div>
      <div class="map-actions" id="mapActions"></div>
    </div>
  </div>
</div>

<script>
// ---------- State ----------
function newState(){
  return {
    phase: 'setup', // setup | play | summary
    numHoles: 18,
    players: [], // {id, name}
    pars: [],
    scores: {}, // scores[playerId] = [throws...]
    currentHole: 0,
    nextPlayerId: 1,
    pendingTemplateId: null, // template picked in setup, applied by startRound
    tees: [], // tees[holeIdx] = {lat, lng} or null; numHoles long once the round has started
    templateId: null, // id of the course template this round was started from (or last saved as)
  };
}
let state = newState();

// Pad (or trim) a tees array to n holes; also fixes data saved before tees existed
function padTees(tees, n){
  return Array.from({length: n}, (_, i) => (Array.isArray(tees) && tees[i]) || null);
}

let courseTemplates = [];
const COURSE_KEY = 'discgolf_baner_v1';
let modal = null; // transient UI state, not persisted: {type:'confirm'|'prompt', message, action, payload, defaultValue}

function loadTemplates(){
  try {
    const raw = localStorage.getItem(COURSE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    courseTemplates = Array.isArray(parsed) ? parsed.filter(t => t && typeof t === 'object') : [];
  } catch(e) { courseTemplates = []; }
  courseTemplates.forEach(t => { t.tees = padTees(t.tees, t.numHoles); });
}
function saveTemplates(){
  try { localStorage.setItem(COURSE_KEY, JSON.stringify(courseTemplates)); } catch(e) {}
}
function saveCourseAsTemplate(){
  modal = { type:'prompt', message:'Navn på banen:', action:'saveTemplate', defaultValue:'' };
  render();
  setTimeout(() => { const el = document.getElementById('modalInput'); if (el) el.focus(); }, 0);
}
function doSaveCourseAsTemplate(name){
  const id = Date.now();
  courseTemplates.push({ id, name, numHoles: state.numHoles, pars: state.pars.slice(), tees: state.tees.slice() });
  saveTemplates();
  // The new template is now the one in use, so later tee updates go to it
  state.templateId = id;
}
function useTemplate(id){
  const tmpl = courseTemplates.find(t => t.id === id);
  if (!tmpl) return;
  state.numHoles = tmpl.numHoles;
  state.pendingTemplateId = tmpl.id;
  render();
}
function pendingTemplate(){
  if (state.pendingTemplateId === null) return null;
  return courseTemplates.find(t => t.id === state.pendingTemplateId) || null;
}
function deleteTemplate(id){
  modal = { type:'confirm', message:'Slette denne banen?', action:'deleteTemplate', payload:id };
  render();
}
function doDeleteTemplate(id){
  courseTemplates = courseTemplates.filter(t => t.id !== id);
  saveTemplates();
  if (state.pendingTemplateId === id) state.pendingTemplateId = null;
}

const STORAGE_KEY = 'discgolf_scorekort_v1';

function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) { /* storage unavailable: carry on without saving */ }
}
function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === 'object' && parsed.phase) {
      // Fill in fields added in later versions, then drop ones no longer used
      state = Object.assign(newState(), parsed);
      state.tees = padTees(state.tees, state.numHoles);
      // Older versions stored the picked template by name instead of id
      if (state.pendingTemplateName && state.pendingTemplateId === null){
        const t = courseTemplates.find(t => t.name === state.pendingTemplateName && t.numHoles === state.numHoles);
        if (t) state.pendingTemplateId = t.id;
      }
      delete state.pendingTemplatePars;
      delete state.pendingTemplateName;
      delete state.pendingTemplateTees;
    }
  } catch(e) { /* corrupt or unavailable storage: start fresh */ }
}

function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

function scoreFor(playerId, holeIdx){
  const arr = state.scores[playerId];
  const v = arr ? arr[holeIdx] : null;
  return (v === null || v === undefined) ? state.pars[holeIdx] : v;
}

function diffColor(diff){
  if (diff <= -2) return 'var(--gold)';
  if (diff === -1) return '#e0b25d';
  if (diff === 0) return 'var(--muted)';
  if (diff === 1) return 'var(--rust-soft)';
  return 'var(--rust)';
}
function diffLabel(diff){
  if (diff === 0) return 'E';
  return diff > 0 ? '+' + diff : String(diff);
}

// ---------- Setup actions ----------
function addPlayer(){
  const input = document.getElementById('newPlayerName');
  const name = input.value.trim();
  if (!name) return;
  const id = state.nextPlayerId++;
  state.players.push({ id, name });
  state.scores[id] = [];
  input.value = '';
  render();
  const el = document.getElementById('newPlayerName');
  if (el) el.focus();
}
function removePlayer(id){
  state.players = state.players.filter(p => p.id !== id);
  delete state.scores[id];
  render();
}
function updateHoleCount(v){
  state.numHoles = clamp(parseInt(v)||1, 1, 36);
  state.pendingTemplateId = null;
}
function startRound(){
  if (state.players.length === 0) return;
  const tmpl = pendingTemplate();
  state.pars = tmpl ? tmpl.pars.slice() : Array(state.numHoles).fill(3);
  state.tees = padTees(tmpl && tmpl.tees, state.numHoles);
  state.templateId = tmpl ? tmpl.id : null;
  state.pendingTemplateId = null;
  state.players.forEach(p => { state.scores[p.id] = Array(state.numHoles).fill(null); });
  state.currentHole = 0;
  state.phase = 'play';
  render();
}

// ---------- Play actions ----------
function setPar(delta){
  state.pars[state.currentHole] = clamp(state.pars[state.currentHole] + delta, 1, 10);
  render();
}
function setScore(playerId, delta){
  const cur = scoreFor(playerId, state.currentHole);
  state.scores[playerId][state.currentHole] = clamp(cur + delta, 1, 20);
  render();
}
function goHole(delta){
  state.currentHole = clamp(state.currentHole + delta, 0, state.numHoles - 1);
  render();
}
function goToSummary(){ state.phase = 'summary'; render(); }
function backToPlay(){ state.phase = 'play'; render(); }
function playAgainSamePlayers(){
  modal = { type:'confirm', message:'Nullstille poengene og spille samme bane på nytt med samme spillere?', action:'playAgain' };
  render();
}
function doPlayAgainSamePlayers(){
  state.players.forEach(p => { state.scores[p.id] = Array(state.numHoles).fill(null); });
  state.currentHole = 0;
  state.phase = 'play';
}
function newRound(){
  modal = { type:'confirm', message:'Starte en ny runde? Nåværende scorekort blir borte.', action:'newRound' };
  render();
}
function doNewRound(){
  state = newState();
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
}

function closeModal(){ modal = null; render(); }
function confirmModalAction(){
  if (!modal) return;
  if (modal.type === 'prompt'){
    const input = document.getElementById('modalInput');
    const val = input ? input.value.trim() : '';
    if (!val) return;
    const action = modal.action;
    modal = null;
    if (action === 'saveTemplate') doSaveCourseAsTemplate(val);
  } else if (modal.type === 'confirm'){
    const action = modal.action;
    const payload = modal.payload;
    modal = null;
    if (action === 'newRound') doNewRound();
    else if (action === 'playAgain') doPlayAgainSamePlayers();
    else if (action === 'deleteTemplate') doDeleteTemplate(payload);
  }
  render();
}

// ---------- Tees ----------
// Returns the name of the template that was updated, or null
function setTee(holeIdx, lat, lng){
  const tee = { lat: +lat.toFixed(6), lng: +lng.toFixed(6) };
  state.tees[holeIdx] = tee;
  // Keep the course template in use up to date
  const tmpl = courseTemplates.find(t => t.id === state.templateId && t.numHoles === state.numHoles);
  if (tmpl) {
    tmpl.tees[holeIdx] = tee;
    saveTemplates();
  }
  render();
  return tmpl ? tmpl.name : null;
}

// ---------- Totals ----------
function totalsFor(playerId){
  let strokes = 0, diff = 0;
  for (let h=0; h<state.numHoles; h++){
    strokes += scoreFor(playerId, h);
    diff += scoreFor(playerId, h) - state.pars[h];
  }
  return { strokes, diff };
}

// ---------- Render ----------
function chainmarkSVG(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="5" r="3" stroke="#2f5744" stroke-width="1.6"/>
    <path d="M9 8 L6 14 M15 8 L18 14 M12 8 L12 14" stroke="#2f5744" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M4 14 H20 L17 19 H7 Z" stroke="#2f5744" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>`;
}

function renderSetup(){
  const picked = pendingTemplate();
  return `
    <div class="topbar">${chainmarkSVG(30)}<h1>Scorekort</h1></div>
    <div class="card">
      <div class="field">
        <label>Antall hull</label>
        <input type="number" min="1" max="36" value="${state.numHoles}"
          oninput="updateHoleCount(this.value)">
        ${picked ? `<div style="font-size:13px;color:var(--pine); margin-top:6px; font-weight:600;">✓ Par hentet fra «${escapeHtml(picked.name)}»</div>` : ''}
      </div>
      <div class="field">
        <label>Lagrede baner</label>
        ${courseTemplates.length ? courseTemplates.map(t => `
          <div class="player-row">
            <div class="name">${escapeHtml(t.name)} <span style="color:var(--muted); font-weight:400;">(${t.numHoles} hull)</span></div>
            <button class="btn-pill" onclick="useTemplate(${t.id})">Bruk</button>
            <button class="icon-btn" onclick="deleteTemplate(${t.id})" aria-label="Slett bane">✕</button>
          </div>
        `).join('') : '<div style="color:var(--muted); font-size:14px; padding:6px 0;">Ingen lagrede baner enda</div>'}
      </div>
      <div class="field">
        <label>Spillere</label>
        ${state.players.map(p => `
          <div class="player-row">
            <div class="name">${escapeHtml(p.name)}</div>
            <button class="icon-btn" onclick="removePlayer(${p.id})" aria-label="Fjern spiller">✕</button>
          </div>
        `).join('') || '<div style="color:var(--muted); font-size:14px; padding:6px 0;">Ingen spillere lagt til enda</div>'}
        <div class="add-row">
          <input type="text" id="newPlayerName" placeholder="Navn på spiller"
            onkeydown="if(event.key==='Enter'){addPlayer(); event.preventDefault();}">
          <button class="btn btn-add" onclick="addPlayer()">Legg til</button>
        </div>
      </div>
      <button class="btn btn-primary" ${state.players.length===0 ? 'disabled' : ''} onclick="startRound()">
        Start runde
      </button>
    </div>
    <p style="text-align:center; color:var(--ink-soft); font-size:13px; margin-top:14px;">
      Par settes til 3 på alle hull som standard (med mindre du bruker en lagret bane) – du justerer par for hvert hull underveis.
    </p>
  `;
}

function renderPlay(){
  const h = state.currentHole;
  const par = state.pars[h];
  const isLast = h === state.numHoles - 1;
  const dots = state.pars.map((_, i) => {
    let cls = 'dot';
    if (i === h) cls += ' current';
    else if (i < h) cls += ' done';
    return `<div class="${cls}"></div>`;
  }).join('');

  const rows = state.players.map(p => {
    const val = scoreFor(p.id, h);
    const diff = val - par;
    return `
      <div class="score-row">
        <div class="pname">${escapeHtml(p.name)}</div>
        <div class="stepper">
          <button onclick="setScore(${p.id}, -1)" aria-label="Ett kast mindre">−</button>
          <div class="val">${val}</div>
          <button onclick="setScore(${p.id}, 1)" aria-label="Ett kast mer">+</button>
        </div>
        <div class="badge" style="background:${diffColor(diff)}">${diffLabel(diff)}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="topbar">
      ${chainmarkSVG(26)}<h1 style="font-size:22px;">Scorekort</h1>
      <button class="btn-pill btn-map" onclick="openMap()" aria-label="Vis kart">📍 Kart${state.tees[h] ? '<span class="has-tee" title="Utkast lagret"></span>' : ''}</button>
    </div>
    <div class="hole-header">
      <button class="nav-arrow" onclick="goHole(-1)" ${h===0 ? 'disabled':''} aria-label="Forrige hull">‹</button>
      <div class="hole-title">
        <div class="hole-num">${h+1}</div>
        <div class="hole-sub">av ${state.numHoles} hull</div>
      </div>
      <button class="nav-arrow" onclick="goHole(1)" ${isLast ? 'disabled':''} aria-label="Neste hull">›</button>
    </div>
    <div class="chain-dots">${dots}</div>
    <div class="par-control">
      <span class="label">Par</span>
      <div class="stepper">
        <button onclick="setPar(-1)" aria-label="Lavere par">−</button>
        <div class="val">${par}</div>
        <button onclick="setPar(1)" aria-label="Høyere par">+</button>
      </div>
    </div>
    <div class="card">
      ${rows}
    </div>
    <div class="bottom-actions">
      <div class="bottom-row">
        <button class="btn btn-secondary" onclick="goHole(-1)" ${h===0 ? 'disabled':''}>‹ Forrige</button>
        ${isLast
          ? `<button class="btn btn-primary" onclick="goToSummary()">Fullfør ✓</button>`
          : `<button class="btn btn-primary" onclick="goHole(1)">Neste ›</button>`
        }
      </div>
      <button class="btn btn-ghost" onclick="goToSummary()">Vis fullt scorekort</button>
      <button class="btn btn-ghost" onclick="saveCourseAsTemplate()">Lagre bane som mal</button>
    </div>
  `;
}

function renderSummary(){
  const totals = state.players.map(p => ({ p, t: totalsFor(p.id) }));
  const best = totals.length ? Math.min(...totals.map(t => t.t.diff)) : null;

  const holeHeaders = Array.from({length: state.numHoles}, (_,i) => `<th>${i+1}</th>`).join('');
  const parCells = state.pars.map(par => `<td>${par}</td>`).join('');

  const rows = totals.map(({p, t}) => {
    const isWinner = t.diff === best;
    const cells = Array.from({length: state.numHoles}, (_,i) => {
      const val = scoreFor(p.id, i);
      const diff = val - state.pars[i];
      return `<td style="color:${diffColor(diff)}; font-weight:700;">${val}</td>`;
    }).join('');
    return `
      <tr class="${isWinner ? 'winner' : ''}">
        <td class="pname-cell">${escapeHtml(p.name)}${isWinner ? '<span class="winner-tag">Leder</span>' : ''}</td>
        ${cells}
        <td style="font-weight:800;">${t.strokes}</td>
        <td style="font-weight:800; color:${diffColor(t.diff)};">${diffLabel(t.diff)}</td>
      </tr>
    `;
  }).join('');

  return `
    <div class="topbar">${chainmarkSVG(26)}<h1 style="font-size:22px;">Fullt scorekort</h1></div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="pname-cell">Spiller</th>
              ${holeHeaders}
              <th>Kast</th>
              <th>+/-</th>
            </tr>
          </thead>
          <tbody>
            <tr class="par-row">
              <td class="pname-cell">Par</td>
              ${parCells}
              <td>${state.pars.reduce((a,b)=>a+b,0)}</td>
              <td>E</td>
            </tr>
            ${rows}
          </tbody>
        </table>
      </div>
    </div>
    <div class="bottom-actions">
      <button class="btn btn-primary" onclick="playAgainSamePlayers()">Spill på nytt – samme spillere</button>
      <button class="btn btn-secondary" onclick="backToPlay()">‹ Tilbake til runden</button>
      <button class="btn btn-ghost" onclick="saveCourseAsTemplate()">Lagre bane som mal</button>
      <button class="btn btn-ghost" onclick="newRound()">Start ny runde</button>
    </div>
  `;
}

function renderModal(){
  if (!modal) return '';
  if (modal.type === 'prompt'){
    return `
      <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal-box">
          <p class="modal-msg">${escapeHtml(modal.message)}</p>
          <input type="text" id="modalInput" value="${escapeHtml(modal.defaultValue||'')}" placeholder="F.eks. Holtekilen DGP"
            onkeydown="if(event.key==='Enter'){confirmModalAction(); event.preventDefault();}">
          <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Avbryt</button>
            <button class="btn btn-primary" onclick="confirmModalAction()">Lagre</button>
          </div>
        </div>
      </div>
    `;
  }
  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-box">
        <p class="modal-msg">${escapeHtml(modal.message)}</p>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Avbryt</button>
          <button class="btn btn-primary" onclick="confirmModalAction()">Bekreft</button>
        </div>
      </div>
    </div>
  `;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(){
  const root = document.getElementById('root');
  let html;
  if (state.phase === 'setup') html = renderSetup();
  else if (state.phase === 'play') html = renderPlay();
  else html = renderSummary();
  root.innerHTML = html + renderModal();
  saveState();
}

// ---------- Map ----------
// Leaflet is loaded lazily the first time the map is opened, so the scorecard works offline.
const LEAFLET_URL = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
const LEAFLET_SRI = {
  js:  'sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==',
  css: 'sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==',
};
const MAP_LAYERS = {
  map: {
    label: 'Kart',
    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    attr: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxNativeZoom: 19,
  },
  photo: {
    label: 'Flyfoto',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    attr: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
    maxNativeZoom: 18,
  },
};
const MAP_LAYER_KEY = 'discgolf_kartlag_v1';
const POOR_GPS_M = 25; // warn when accuracy is worse than this

let mapLayerKey = 'map';
try { const k = localStorage.getItem(MAP_LAYER_KEY); if (Object.hasOwn(MAP_LAYERS, k)) mapLayerKey = k; } catch(e) {}

let leafletPromise = null;
let lmap = null, mapTiles = null, teeMarker = null, posMarker = null, accCircle = null;
let mapHole = 0;          // hole shown in the map (the active hole when the map was opened)
let mapLoadFailed = false;
let fitPending = false;   // re-fit the view once the first GPS fix arrives
let confirmReplace = false;
let mapNote = '', mapNoteTimer = null;
let gpsWatch = null, gpsPos = null, gpsError = null, gpsAgeTimer = null;
const STALE_GPS_S = 30; // a fix older than this is not used for saving

function loadLeaflet(){
  if (window.L) return Promise.resolve();
  if (!leafletPromise){
    leafletPromise = new Promise((resolve, reject) => {
      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = LEAFLET_URL + 'leaflet.min.css';
      css.integrity = LEAFLET_SRI.css;
      css.crossOrigin = 'anonymous';
      const js = document.createElement('script');
      js.src = LEAFLET_URL + 'leaflet.min.js';
      js.integrity = LEAFLET_SRI.js;
      js.crossOrigin = 'anonymous';
      const loaded = el => new Promise((ok, fail) => { el.onload = ok; el.onerror = fail; });
      const both = Promise.all([loaded(css), loaded(js)]);
      document.head.appendChild(css);
      document.head.appendChild(js);
      both.then(() => resolve(), () => { leafletPromise = null; css.remove(); js.remove(); reject(); });
    });
  }
  return leafletPromise;
}

function isMapOpen(){ return !document.getElementById('mapOverlay').hidden; }

function openMap(){
  mapHole = state.currentHole;
  confirmReplace = false;
  mapLoadFailed = false;
  fitPending = true;
  setMapNote('');
  document.getElementById('mapOverlay').hidden = false;
  document.getElementById('mapTitle').innerHTML = `Hull ${mapHole+1} <span>· par ${state.pars[mapHole]}</span>`;
  updateLayerBtn();
  if (location.protocol === 'file:'){
    mapLoadFailed = true;
    updateMapFoot();
    return;
  }
  updateMapFoot();
  startGps();
  loadLeaflet().then(() => {
    if (!isMapOpen()) return;
    initMap();
    lmap.invalidateSize();
    showTee();
    updateGpsMarker();
    fitMapView();
    if (gpsPos) fitPending = false;
  }).catch(() => {
    mapLoadFailed = true;
    updateMapFoot();
  });
}

function closeMap(){
  document.getElementById('mapOverlay').hidden = true;
  stopGps();
  confirmReplace = false;
  gpsPos = null;
  if (posMarker){ lmap.removeLayer(posMarker); lmap.removeLayer(accCircle); posMarker = accCircle = null; }
}

function initMap(){
  if (lmap) return;
  lmap = L.map('map').setView([62, 10], 5);
  // Don't yank the view around once the user has started panning
  lmap.on('dragstart', () => { fitPending = false; });
  setMapLayer(mapLayerKey);
}

function setMapLayer(key){
  mapLayerKey = key;
  try { localStorage.setItem(MAP_LAYER_KEY, key); } catch(e) {}
  updateLayerBtn();
  if (!lmap) return;
  const cfg = MAP_LAYERS[key];
  if (mapTiles) lmap.removeLayer(mapTiles);
  mapTiles = L.tileLayer(cfg.url, { attribution: cfg.attr, maxNativeZoom: cfg.maxNativeZoom, maxZoom: 20 }).addTo(lmap);
}
function toggleMapLayer(){ setMapLayer(mapLayerKey === 'map' ? 'photo' : 'map'); }
function updateLayerBtn(){
  // The button shows the layer you switch *to*
  document.getElementById('mapLayerBtn').textContent = MAP_LAYERS[mapLayerKey === 'map' ? 'photo' : 'map'].label;
}

function fitMapView(){
  if (!lmap) return;
  const tee = state.tees[mapHole];
  if (tee && gpsPos && distanceM(tee, gpsPos) < 1500){
    lmap.fitBounds([[tee.lat, tee.lng], [gpsPos.lat, gpsPos.lng]], { padding:[50,50], maxZoom:18 });
  } else if (tee){
    lmap.setView([tee.lat, tee.lng], 18);
  } else if (gpsPos){
    lmap.setView([gpsPos.lat, gpsPos.lng], 18);
  }
}

function showTee(){
  if (!lmap) return;
  const tee = state.tees[mapHole];
  if (!tee){
    if (teeMarker){ lmap.removeLayer(teeMarker); teeMarker = null; }
    return;
  }
  const icon = L.divIcon({
    className: 'tee-marker',
    html: `<div class="tee-icon"><span>${mapHole+1}</span></div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 36], // tip of the rotated pin
  });
  if (!teeMarker){
    teeMarker = L.marker([tee.lat, tee.lng], { icon, draggable:true, zIndexOffset:1000, title:'Utkast' }).addTo(lmap);
    teeMarker.on('dragend', () => {
      confirmReplace = false;
      const ll = teeMarker.getLatLng();
      const tmplName = setTee(mapHole, ll.lat, ll.lng);
      setMapNote(`Utkast flyttet${tmplName ? ` og lagret i «${escapeHtml(tmplName)}»` : ''} ✓`);
    });
  } else {
    teeMarker.setLatLng([tee.lat, tee.lng]).setIcon(icon);
  }
}

function startGps(){
  gpsError = null;
  if (!window.isSecureContext){ gpsError = 'Posisjon krever at siden åpnes over https.'; return; }
  if (!navigator.geolocation){ gpsError = 'Enheten støtter ikke posisjon.'; return; }
  if (gpsWatch !== null) return;
  gpsWatch = navigator.geolocation.watchPosition(onGps, onGpsError,
    { enableHighAccuracy:true, maximumAge:5000, timeout:20000 });
  // Re-check how old the position is even when no new fixes arrive
  clearInterval(gpsAgeTimer);
  gpsAgeTimer = setInterval(updateMapFoot, 5000);
}
function gpsAgeS(){ return gpsPos ? Math.round((Date.now() - gpsPos.t) / 1000) : 0; }
function stopGps(){
  if (gpsWatch !== null){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; }
  clearInterval(gpsAgeTimer);
}
function onGps(p){
  // Use our own clock: some browsers report timestamps from a different epoch
  gpsPos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), t: Date.now() };
  gpsError = null;
  updateGpsMarker();
  if (fitPending && lmap){ fitMapView(); fitPending = false; }
  updateMapFoot();
}
function onGpsError(e){
  if (e.code === 1) gpsError = 'Ingen tilgang til posisjon. Tillat stedstjenester for nettleseren.';
  else if (!gpsPos) gpsError = 'Finner ikke posisjonen din.';
  updateMapFoot();
}
function updateGpsMarker(){
  if (!lmap || !gpsPos) return;
  const ll = [gpsPos.lat, gpsPos.lng];
  if (!posMarker){
    const css = getComputedStyle(document.documentElement);
    const gps = css.getPropertyValue('--gps').trim(), ring = css.getPropertyValue('--surface').trim();
    accCircle = L.circle(ll, { radius: gpsPos.acc, color:gps, weight:1, fillOpacity:0.12, interactive:false }).addTo(lmap);
    posMarker = L.circleMarker(ll, { radius:8, color:ring, weight:3, fillColor:gps, fillOpacity:1, interactive:false }).addTo(lmap);
  } else {
    posMarker.setLatLng(ll);
    accCircle.setLatLng(ll).setRadius(gpsPos.acc);
  }
}

function distanceM(a, b){
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*rad) * Math.cos(b.lat*rad) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function setMapNote(html){
  mapNote = html;
  clearTimeout(mapNoteTimer);
  if (html) mapNoteTimer = setTimeout(() => { mapNote = ''; updateMapFoot(); }, 4000);
  updateMapFoot();
}

function updateMapFoot(){
  const tee = state.tees[mapHole];
  let status;
  if (mapLoadFailed) status = location.protocol === 'file:'
    ? 'Kartet virker bare når siden åpnes fra en nettadresse (http/https), ikke som fil.'
    : 'Kunne ikke laste kartet. Sjekk nettforbindelsen.';
  else if (confirmReplace) status = `Erstatte lagret utkast for hull ${mapHole+1} med posisjonen din?`;
  else if (mapNote) status = mapNote;
  else if (gpsError) status = gpsError;
  else if (!gpsPos) status = 'Finner posisjonen din…';
  else {
    const gpsInfo = gpsAgeS() > STALE_GPS_S ? `⚠️ GPS sist oppdatert for ${gpsAgeS()} s siden` : `GPS ±${gpsPos.acc} m`;
    status = tee
      ? `Avstand til utkast: <b>${Math.round(distanceM(tee, gpsPos))} m</b> · ${gpsInfo}<br><small>Dra markøren for å finjustere</small>`
      : `Ingen utkast lagret for hull ${mapHole+1} · ${gpsInfo}`;
  }

  const actions = confirmReplace
    ? `<button class="btn btn-secondary" onclick="cancelReplaceTee()">Avbryt</button>
       <button class="btn btn-primary" onclick="saveTeeHere()">Erstatt</button>`
    : `<button class="btn btn-primary" onclick="saveTeeHere()" ${gpsPos ? '' : 'disabled'}>Lagre utkast her</button>`;

  document.getElementById('mapStatus').innerHTML = status;
  // Only touch the buttons when they change; GPS updates every second and would otherwise eat taps
  const actionsEl = document.getElementById('mapActions');
  if (actionsEl.dataset.html !== actions){ actionsEl.innerHTML = actions; actionsEl.dataset.html = actions; }
}

function saveTeeHere(){
  if (!gpsPos) return;
  if (gpsAgeS() > STALE_GPS_S){
    // Never save an old position: fetch a fresh one first, then continue
    setMapNote('Henter ny posisjon…');
    navigator.geolocation.getCurrentPosition(
      p => { onGps(p); setMapNote(''); saveTeeHere(); },
      () => setMapNote('Fant ikke ny posisjon. Prøv igjen.'),
      { enableHighAccuracy:true, maximumAge:0, timeout:15000 });
    return;
  }
  if (state.tees[mapHole] && !confirmReplace){
    confirmReplace = true;
    updateMapFoot();
    return;
  }
  confirmReplace = false;
  const tmplName = setTee(mapHole, gpsPos.lat, gpsPos.lng);
  showTee();
  let note = `Utkast lagret for hull ${mapHole+1}${tmplName ? ` og i «${escapeHtml(tmplName)}»` : ''} ✓`;
  if (gpsPos.acc > POOR_GPS_M) note += `<br><small>Unøyaktig GPS (±${gpsPos.acc} m) – dra markøren til riktig sted</small>`;
  setMapNote(note);
}
function cancelReplaceTee(){
  confirmReplace = false;
  updateMapFoot();
}

loadTemplates();
loadState();
render();
</script>
</body>
</html>
